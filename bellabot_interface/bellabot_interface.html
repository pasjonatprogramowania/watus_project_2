<!DOCTYPE html>
<html lang="pl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Watus BellaBot Interface</title>
        <link rel="stylesheet" href="bellabot_interface.css" />
    </head>
    <body>
        <div id="app" class="robot-container state-neutral">
            <div class="led"></div>

            <div class="screen">
                <div id="sleep-z" class="sleep-z" style="display: none"><span>Z</span><span>z</span><span>z</span></div>

                <div class="face">
                    <div class="eyes">
                        <div class="eye"><div id="left-eye" class="eye-circle"></div></div>
                        <div class="eye"><div id="right-eye" class="eye-circle"></div></div>
                    </div>
                    <div class="mouth"><div id="mouth" class="mouth-line"></div></div>
                </div>

                <div class="status-bar">
                    <div id="status-dot" class="status-dot" style="background: #ef4444"></div>
                    <span id="status-text" class="status-text">Neutralny</span>
                </div>
            </div>

            <div class="controls">
                <button class="btn" data-state="neutral" onclick="setState('neutral')">Neutralny</button>
                <button class="btn" data-state="listening" onclick="setState('listening')">Słucham</button>
                <button class="btn" data-state="thinking" onclick="setState('thinking')">Myślę</button>
                <button class="btn" data-state="excited" onclick="setState('excited')">Mówię</button>
                <button class="btn" data-state="sleeping" onclick="setState('sleeping')">Śpię</button>
                <button class="btn" data-state="joyful" onclick="setState('joyful')">Radość</button>
                <button class="btn" data-state="winking" onclick="setState('winking')">Mrugnięcie</button>
                <button class="btn" data-state="reconnect" onclick="setState('reconnect')">Błąd</button>
            </div>
        </div>

        <script>
            // Konfiguracja
            var stateNames = {
                neutral: 'Neutralny',
                listening: 'Słucham',
                thinking: 'Myślę',
                excited: 'Mówię',
                sleeping: 'Śpię',
                joyful: 'Radość',
                winking: 'Mrugnięcie',
                reconnect: 'Łączenie...',
            };

            var stateColors = {
                neutral: '#6b7280',
                listening: '#a855f7',
                thinking: '#f59e0b',
                excited: '#22c55e',
                sleeping: '#3b82f6',
                joyful: '#ec4899',
                winking: '#ec4899',
                reconnect: '#ef4444',
            };

            var eyeClasses = {
                neutral: 'eye-circle',
                listening: 'eye-listen',
                thinking: 'eye-think',
                excited: 'eye-excited',
                sleeping: 'eye-closed-arc',
                joyful: 'eye-happy-arc',
                winking: 'eye-circle', // Left eye
                reconnect: 'eye-droopy-left',
            };

            var rightEyeClasses = {
                neutral: 'eye-circle',
                listening: 'eye-listen',
                thinking: 'eye-think',
                excited: 'eye-excited',
                sleeping: 'eye-closed-arc',
                joyful: 'eye-happy-arc',
                winking: 'eye-wink', // Right eye winks
                reconnect: 'eye-droopy-right',
            };

            var mouthClasses = {
                neutral: 'mouth-line',
                listening: 'mouth-dot',
                thinking: 'mouth-think',
                excited: 'mouth-excited',
                sleeping: 'mouth-o',
                joyful: 'mouth-joy',
                winking: 'mouth-wink',
                reconnect: 'mouth-sad',
            };

            var stateMapping = {
                listening: 'listening',
                processing: 'thinking',
                speaking: 'excited',
                idle: 'neutral',
            };

            // Stan aplikacji
            var currentState = 'neutral';
            var connected = false;
            var ws = null;

            // Elementy DOM
            var app = document.getElementById('app');
            var leftEye = document.getElementById('left-eye');
            var rightEye = document.getElementById('right-eye');
            var mouth = document.getElementById('mouth');
            var statusDot = document.getElementById('status-dot');
            var statusText = document.getElementById('status-text');
            var sleepZ = document.getElementById('sleep-z');
            var buttons = document.querySelectorAll('.btn');

            // Funkcja zmiany stanu
            function setState(newState) {
                if (!stateNames[newState]) return;

                // Aktualizuj stan
                currentState = newState;
                console.log('[UI] Stan: ' + stateNames[newState]);

                // Aktualizuj klasę kontenera
                app.className = 'robot-container state-' + newState;

                // Aktualizuj oczy
                leftEye.className = eyeClasses[newState] || 'eye-circle';
                rightEye.className = rightEyeClasses[newState] || 'eye-circle';

                // Aktualizuj usta
                mouth.className = mouthClasses[newState] || 'mouth-line';

                // Aktualizuj status
                statusText.textContent = stateNames[newState];

                // Sleep Z
                sleepZ.style.display = newState === 'sleeping' ? 'block' : 'none';

                // Aktualizuj przyciski
                buttons.forEach(function (btn) {
                    var btnState = btn.getAttribute('data-state');
                    if (btnState === newState) {
                        btn.classList.add('active');
                        btn.style.background = stateColors[newState];
                        btn.style.color = '#fff';
                    } else {
                        btn.classList.remove('active');
                        btn.style.background = '';
                        btn.style.color = '';
                    }
                });
            }

            // Funkcja aktualizacji połączenia
            function setConnected(isConnected) {
                connected = isConnected;
                statusDot.style.background = isConnected ? '#22c55e' : '#ef4444';
            }

            // WebSocket
            function connectWebSocket() {
                try {
                    ws = new WebSocket('ws://localhost:8080');

                    ws.onopen = function () {
                        setConnected(true);
                        console.log('[WS] Połączono');
                    };

                    ws.onmessage = function (event) {
                        try {
                            var data = JSON.parse(event.data);
                            if (data.type === 'state') {
                                var mapped = stateMapping[data.state] || data.state;
                                setState(mapped);
                                console.log('[WS] ' + data.state + ' -> ' + mapped);
                            }
                        } catch (e) {
                            console.error('[WS] Błąd:', e);
                        }
                    };

                    ws.onclose = function () {
                        setConnected(false);
                        console.log('[WS] Rozłączono');
                        setState('reconnect');
                        setTimeout(connectWebSocket, 2000);
                    };

                    ws.onerror = function () {
                        setConnected(false);
                    };
                } catch (e) {
                    console.error('[WS] Błąd:', e);
                    setTimeout(connectWebSocket, 2000);
                }
            }

            // Start
            console.log('[UI] Watus BellaBot Interface v3.0 PL');
            setState('neutral');
            connectWebSocket();
        </script>
    </body>
</html>
